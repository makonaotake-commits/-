<title>要件 第4版の確認</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの質問カード列＋下部固定の送信バー。カードはタップで選ぶ大きな選択肢 */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --ink:#1f2420; --muted:#5d665f; --line:#d9ded6;
  --accent:#2f6b57; --accent-soft:#e3efe9; --rec:#8a5a12; --rec-soft:#f6ecd9;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1d211e; --ink:#e9ece7; --muted:#a3aca5; --line:#323833; --accent:#7cc4a6; --accent-soft:#1f3a30; --rec:#e3b66a; --rec-soft:#3a2f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1d211e; --ink:#e9ece7; --muted:#a3aca5; --line:#323833;
  --accent:#7cc4a6; --accent-soft:#1f3a30; --rec:#e3b66a; --rec-soft:#3a2f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-size:1.6rem;line-height:1.35;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.q.done{border-color:var(--accent)}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.qnum{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.q h2{font-family:var(--display);font-size:1.12rem;margin:2px 0 0;line-height:1.45;text-wrap:balance}
.why{margin:0;font-size:.86rem;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex-shrink:0;max-width:45%}
.cat{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;
  background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt::before{content:"";position:absolute;left:12px;top:14px;width:16px;height:16px;border:2px solid var(--muted);border-radius:50%}
.opt.multi::before{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.opt b{font-weight:700;font-size:.95rem}
.opt small{color:var(--muted);font-size:.8rem;line-height:1.5}
.rec{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--rec-soft);color:var(--rec);vertical-align:1px}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:160px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.prog p{margin:4px 0 0;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
button.send{font:inherit;font-weight:700;background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:10px 20px;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
button.send:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.status{font-size:.82rem;color:var(--muted);width:100%}
@media (max-width:480px){.qhead{flex-direction:column}.cats{justify-content:flex-start;max-width:none}}
</style>

<div class="wrap">
  <header>
    <h1>要件 第4版の確認 🐈‍⬛</h1>
    <p>ブリショーが6枚のシートの回答を要件定義書に反映し（第4版）、薬リストを v0.2 にしました。新しく決めていただきたい点です。迷ったら<span class="rec">おすすめ</span>を選んでおけば大丈夫です。</p>
    <div class="legend"><span>各質問の右上：その答えを使う猫</span></div>
  </header>
  <main id="qs" class="wrap" style="gap:16px"></main>
</div>

<div class="bar"><div class="in">
  <div class="prog"><div class="track"><div class="fill" id="fill"></div></div><p id="count">0 / 8 回答済み</p></div>
  <button class="send" id="send" type="button">ボンベイに送る</button>
  <div class="status" id="status" role="status"></div>
</div></div>

<script>
const Q = [
 {id:"q30",title:"「記録のお知らせ」の作り方は、この案でよいですか？",why:"「体調変化の通知を中立的に残す」を受けて、ブリショーが作り直しました。アプリ側では条件も基準も持ちません。飼い主さんが「どの猫の・どの項目が・どの段階になったら」を自分で選んで条件を作り、何も設定しなければお知らせは一切出ません。文言は「設定した条件にあてはまる記録がありました（むぎ・食欲）」程度の事実だけです。説明文は「あなたが決めた条件にあてはまる記録があったときに、そのことをお知らせします。判定や診断はしません。」です。",cats:["ブリショー","ロシアン","マンチカン"],opts:[
  ["ok_opt_push","この案でよい。プッシュ通知は条件ごとに任意","画面内の表示に加えて、希望する条件だけプッシュ通知にできる",1],
  ["ok_in_app","この案でよい。ただしプッシュ通知はなし","画面内の表示だけにする"],
  ["fix","直したい点がある","補足欄に書いてください"]]},
 {id:"q33",title:"「記録のお知らせ」の条件に、体重などの数値も使えるようにしますか？",why:"第1弾で条件にできるのは、選択式の項目（食欲など）と、回数の項目が記録されたときだけです（仮）。数値（体重が◯kg を下回ったら など）を条件にすると、基準値の判定に見えやすくなるため、ロシアンの確認が必要です。",cats:["ブリショー","ロシアン"],opts:[
  ["phase2","第1弾は使えない。第2弾で検討する","ロシアンの確認を経てから",1],
  ["phase1","第1弾から使えるようにする","ロシアンの確認が前提になる"]]},
 {id:"q31",title:"輸液剤の名前に、候補リストを用意しますか？",why:"補液の記録に「輸液名」の欄を足しました。今は自由入力と、過去に入力した名前の補完です。",cats:["ブリショー"],opts:[
  ["free","第1弾は自由入力だけ","候補の保守が要らない",1],
  ["list","候補リストを作る","乳酸リンゲル液・生理食塩液など。あなたが範囲を決める"]]},
 {id:"q32a",title:"レンジアレンは、医薬品とサプリのどちらとして扱いますか？",why:"薬のリストに入れるかどうかが変わります（サプリは薬のリストに入れない決定です）。獣医師としての判断をお願いします。",cats:["ブリショー","ロシアン"],opts:[
  ["drug","動物用医薬品として、薬のリストに入れる","補足欄に根拠（承認の有無など）があれば書いてください"],
  ["supp","サプリ（食品）として、薬のリストには入れない","自由入力で記録できる"],
  ["unsure","分からないので確認してほしい","ブリショーが一次情報で確かめる"]]},
 {id:"q32b",title:"エランコの猫用製品「エルーラ」を、薬のリストに追加しますか？",why:"ブリショーが追加の候補として挙げました（検索結果で見つけただけで、一次情報での確認はまだです）。",cats:["ブリショー"],opts:[
  ["add","追加する","表記は一次情報で確かめてから収録する"],
  ["no","追加しない",""],
  ["unsure","判断を保留する","補足欄に気になる点を書いてください"]]},
 {id:"verify",title:"一次情報で確認できていない薬（コバルジン・ラプロスなど動物用5件と人の薬15件）は、どう確かめますか？",why:"メーカーのサイトがネットワークの制限で開けず、データベースの検索も使えなかったため、まだ確認できていません。確認が済むまでは、アプリに収録しません。",cats:["ブリショー","ロシアン"],opts:[
  ["vet_confirm","獣医師（自分）が表記を確認する","ブリショーが一覧を作り、あなたが正しい表記にチェックを入れる",1],
  ["allow_hosts","メーカーなどのサイトを開けるようにする","ボンベイがネットワーク設定の変更を申請します（承認画面が出ます）"],
  ["both","両方","サイトで確かめたうえで、あなたが最終確認する"]]},
 {id:"honorarium",title:"外部の獣医師にチェックをお願いするとき、謝礼は払いますか？",why:"ベンガルが依頼書の下書きを作りました（docs/marketing/vet_reviewer_request_draft.md。ロシアンのレビューは修正後OK）。どちらを選んでも法的な問題はありません。謝礼を払わない場合は、物品や特典も渡さないことが条件です。名前を出す場合は、謝礼の有無も開示します。",cats:["ベンガル","ロシアン"],opts:[
  ["a","案A：謝礼を払う","お願いしやすい。名前を出すときは「有償の確認」と開示する"],
  ["b","案B：謝礼なし","物品・特典も渡さない。お願いできる人が限られるかもしれない"],
  ["later","候補が見つかってから決める","4週目までに候補3人を探す予定",1]]},
 {id:"q28",title:"運営者名（開発者登録の名義）は、いつ決めますか？",why:"Apple と Google の開発者登録の前に必要です。リリース計画では1週目に登録する予定です。",cats:["ブリショー","マンチカン"],opts:[
  ["now","いま決める","補足欄に、個人名か屋号か、表示してよい名前と連絡先を書いてください"],
  ["before_reg","開発者登録をするときに決める","試作を触るのには不要",1]]}
];
const state = {answers:{}, notes:{}, free:""};
const $ = s=>document.querySelector(s);
function render(){
  const root=$("#qs"); root.innerHTML="";
  Q.forEach((q,i)=>{
    const sec=document.createElement("section"); sec.className="q"; sec.id="q-"+q.id;
    const head=document.createElement("div"); head.className="qhead";
    const left=document.createElement("div");
    left.innerHTML=`<div class="qnum">Q${i+1} / ${Q.length}${q.multi?"・複数選択":""}</div>`;
    const h=document.createElement("h2"); h.textContent=q.title; left.appendChild(h);
    const cats=document.createElement("div"); cats.className="cats";
    q.cats.forEach(c=>{const s=document.createElement("span");s.className="cat";s.textContent=c;cats.appendChild(s)});
    head.append(left,cats); sec.appendChild(head);
    const why=document.createElement("p"); why.className="why"; why.textContent=q.why; sec.appendChild(why);
    const opts=document.createElement("div"); opts.className="opts"; opts.setAttribute("role","group"); opts.setAttribute("aria-label",q.title);
    q.opts.forEach(([v,label,desc,rec])=>{
      const b=document.createElement("button"); b.type="button"; b.className="opt"+(q.multi?" multi":""); b.dataset.q=q.id; b.dataset.v=v;
      const bl=document.createElement("b"); bl.textContent=label;
      if(rec){const r=document.createElement("span");r.className="rec";r.textContent="おすすめ";bl.appendChild(r)}
      const sm=document.createElement("small"); sm.textContent=desc;
      b.append(bl,sm); b.addEventListener("click",()=>pick(q,v)); opts.appendChild(b);
    });
    sec.appendChild(opts);
    const ta=document.createElement("textarea"); ta.id="note-"+q.id; ta.placeholder="補足があれば（任意）"; ta.rows=1;
    ta.value=state.notes[q.id]||""; ta.addEventListener("input",()=>{state.notes[q.id]=ta.value;dirty()});
    sec.appendChild(ta); root.appendChild(sec);
  });
  const sec=document.createElement("section"); sec.className="q";
  sec.innerHTML=`<div class="qnum">自由記入（任意）</div><h2>ほかに伝えたいこと</h2><p class="why">例：特に急いでほしいこと、参考にしたいアプリやアカウント、避けたいこと など。</p>`;
  const ta=document.createElement("textarea"); ta.id="free"; ta.rows=3; ta.value=state.free; ta.addEventListener("input",()=>{state.free=ta.value;dirty()});
  sec.appendChild(ta); root.appendChild(sec);
  paint();
}
function pick(q,v){
  if(q.multi){const cur=new Set(state.answers[q.id]||[]); cur.has(v)?cur.delete(v):cur.add(v); state.answers[q.id]=[...cur];}
  else state.answers[q.id]=v;
  paint(); dirty();
}
function answered(q){const a=state.answers[q.id];return q.multi?(a&&a.length>0):!!a}
function paint(){
  document.querySelectorAll(".opt").forEach(b=>{
    const a=state.answers[b.dataset.q]; const on=Array.isArray(a)?a.includes(b.dataset.v):a===b.dataset.v;
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  let n=0; Q.forEach(q=>{const ok=answered(q); if(ok)n++; const s=document.getElementById("q-"+q.id); if(s)s.classList.toggle("done",ok)});
  $("#fill").style.width=(n/Q.length*100)+"%"; $("#count").textContent=`${n} / ${Q.length} 回答済み`;
}
function dirty(){$("#status").textContent="未送信の変更があります";}
function labelOf(q,v){const o=q.opts.find(o=>o[0]===v);return o?o[1]:v}
function summary(){
  return Q.map((q,i)=>{const a=state.answers[q.id];const t=!a||(Array.isArray(a)&&!a.length)?"（未回答）":Array.isArray(a)?a.map(v=>labelOf(q,v)).join("、"):labelOf(q,a);
    const n=state.notes[q.id]?`／補足：${state.notes[q.id]}`:""; return `Q${i+1} ${q.title}\n→ ${t}${n}`}).join("\n\n")+(state.free?`\n\n自由記入：${state.free}`:"");
}
let db=null, ref=null;
render();
(async()=>{
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db){ $("#send").textContent="回答をコピー"; $("#status").textContent="保存機能が使えない表示です。「回答をコピー」でチャットに貼り付けてください。"; return; }
  ref = db.doc("answers/req_v4");
  const t=setTimeout(()=>{$("#status").textContent="前回の回答を読み込めませんでした。新しく回答できます。"},10000);
  try{const s=await ref.get(); clearTimeout(t);
    if(s.exists){const d=s.data(); Object.assign(state.answers,d.answers||{}); Object.assign(state.notes,d.notes||{}); state.free=d.free||""; render();
      $("#status").textContent="前回送った回答を読み込みました。変更して送り直せます。";}
  }catch(e){clearTimeout(t);}
})();
$("#send").addEventListener("click",async()=>{
  const btn=$("#send");
  if(!ref){ try{await navigator.clipboard.writeText(summary()); $("#status").textContent="コピーしました。チャットに貼り付けてください。";}
    catch(e){$("#status").textContent="コピーできませんでした。お手数ですが選んだ内容をチャットでお知らせください。";} return; }
  btn.disabled=true; $("#status").textContent="送信中…";
  try{ await ref.set({answers:state.answers,notes:state.notes,free:state.free,summary:summary(),submittedAt:new Date().toISOString()});
    $("#status").textContent="ボンベイに届きました。チャットで「送ったよ」と伝えてください。";
  }catch(e){ $("#status").textContent="保存できませんでした（"+(e&&e.code||"エラー")+"）。もう一度押すか、チャットで答えを教えてください。"; }
  btn.disabled=false;
});
</script>
