body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;

<script>
const Q = [{"id": "profile", "title": "プロフィール文とハイライト構成を、監修獣医師として承認しますか？", "why": "ロシアンのレビューを通過しています。氏名（◯◯）は、実名をいただいたら入れて、その部分だけロシアンが再確認します。下の「本文を開く」で全文を確認できます。", "doc": "# Instagram プロフィール文・ハイライト構成（案）\n\n- ステータス：`compliance_reviewed`（ロシアン 2026-11-11。仕上げ版プロフィール文〔パターン A〕とハイライト構成。氏名「◯◯」を入れたら差分だけ確認。次は監修獣医師の確認）\n- 作成：スコティ／2026-11-09\n- 前提：`CLAUDE.md`、`.claude/agents/scoty.md`、`docs/kickoff_answers.md`\n- 公開までの流れ：スコティが作成 → ロシアンのレビュー → 監修獣医師（ユーザー）の確認 → 公開\n\n> ベンガルのポジショニング（`docs/marketing/02_positioning.md`）とアビシニアンのトレンドレポートはまだありません。それらができたら言葉選びとハッシュタグを見直します。\n\n---\n\n## 0. 前提として決まっていること\n\n| 項目 | 内容 | 出典 |\n|---|---|---|\n| 主に届けたい人 | 診断を受けたばかりの飼い主さんから、在宅ケア中の飼い主さんまで | kickoff #1 |\n| 立場 | 獣医師が監修する公式アカウント。監修するのは運営者（ユーザー）本人 | kickoff #8・追加の決定 |\n| アプリがすること | 記録して見える化するだけ。判定や提案はしない | kickoff #2 |\n| 世界観 | ペットロスへの配慮を最優先する。親しみやすく、信頼できるシンプルなラインアート。急かさない、ゆとりのある雰囲気 | 自由記入 |\n\n### プロフィールで必ず守ること\n1. **監修する獣医師が運営者本人であることを書く。** 利益相反がどう見えるかを考えての開示です（kickoff の注意点）。\n2. **個別の診療相談には応じないことを書く。** 獣医師法との関係で、DM やコメントで個別の診断をしていると受け取られないようにします。\n3. 「早く見つけられる」「長生きできる」「数値が良くなる」のような効果をうたう言葉は使わない。\n4. アプリがリリースされるまでは「準備中」と書き、まだない機能を「使える」とは書かない。\n\n---\n\n## 0-2. あとから決まったこと（2026-11-09 追記）\n\nユーザーがプロフィール文を選んだあとで、次の点を反映して仕上げます。今の選択肢の文面は、比べやすいように変えていません。\n\n| 決定・申し送り | プロフィールへの反映 |\n|---|---|\n| コア・メッセージは「腎臓病の猫との毎日を、ゆっくり記録する。」（ユーザー決定） | 選ばれたパターンの2行目を、この言葉に寄せる |\n| 監修者の書き方は「獣医師が運営・監修」が先（`02_positioning.md` §6） | 「獣医師監修（運営者本人が獣医師です）」を「獣医師が運営・監修しています」に直す |\n| 事前登録は Google Play だけ（ユーザー決定） | リンク欄は Google Play の事前登録ページにする。iPhone の方向けに「リリースはこのアカウントでお知らせします」と添える |\n| 「長く」「長生き」は使わない（要件レビュー #20） | 3パターンとも使っていない（確認済み） |\n\n## 決定（2026-11-11、Instagram デザイン選択シート）\n\n| 項目 | 決定 |\n|---|---|\n| プロフィール文 | **A 寄り添い型** |\n| 表示名 | **【アプリ名】｜腎臓病の猫と暮らす** |\n| 監修獣医師 | **実名だけ** 出す（氏名は未受領なので ◯◯） |\n| 開示 | 外部の獣医師にもチェックを依頼する。収益源を書く |\n| 「こころ」ハイライト | 投稿がたまってから置く |\n| ピラー名 | 「いつもとちがう」に気づく・伝える（ハイライト5も「いつもとちがう」） |\n\n### 仕上げ版プロフィール文（パターン A ＋ これまでの決定を反映）\n\n```\n腎臓病（CKD）の猫と暮らす飼い主さんへ🐾\n毎日を、うちの子といっしょに、ゆっくり記録する。\n・補液や投薬の工夫、検査値のやさしい図解\n・獣医師 ◯◯ が運営・監修（▼固定投稿に詳しく）\n※個別の診療相談はかかりつけの先生へ\n▼Android事前登録受付中（iPhoneはこちらでお知らせ）\n```\n\n- 反映したこと：コア・メッセージ案3の「ゆっくり記録する」、「運営・監修」の順、事前登録は Google Play だけ。「補液や投薬のコツ」は、手技の指導と受け取られないよう「工夫」にしました（ロシアン 追記3）。\n- 文字数は 150 字以内に収まるよう作りました（全角で数えた目安。実際の画面で確認します）。\n- 「外部の獣医師にも確認を依頼」と収益源は、150 字に入りきらないため、**固定投稿（12/1）とハイライト「はじめに」** に書きます（開示文は `calendar_2026-12.md`）。プロフィールには「▼固定投稿に詳しく」の導線を入れました（ロシアン推奨：追記3）。\n- 「◯◯」には、ユーザーから受け取った実名を入れます。\n\n---\n\n## 1. 表示名（名前欄）の案\n\nアプリ名が決まっていないため、【アプリ名】のところは仮置きです。\n\n| 案 | 表示名 | ねらい |\n|---|---|---|\n| a | 【アプリ名】｜腎臓病の猫と暮らす | 「腎臓病」「猫」で検索したときに引っかかりやすくする |\n| b | 【アプリ名】｜猫のCKDケア記録 | アプリであることが伝わる |\n| c | 【アプリ名】獣医師監修・猫の腎臓病 | 信頼感を先に出す |\n\n※ 名前欄の文字も Instagram 内の検索対象になると言われています。ただし仕様は変わるので、公開前に確認します（推測）。\n\n---\n\n## 2. プロフィール文の案（3パターン）\n\n文字数はどれも 150 字以内（自己紹介文の上限は 150 字とされています。公開前に実際の画面で確認します）。\n\n### パターン A「寄り添い型」（おすすめ）\n\n```\n腎臓病（CKD）の猫と暮らす飼い主さんへ🐾\n毎日のケアを、うちの子といっしょに、ゆっくり。\n・補液や投薬のコツ、検査値のやさしい図解\n・獣医師監修（運営者本人が獣医師です）\n※個別の診療相談はかかりつけの先生へ\n▼記録アプリ（準備中）\n```\n\n- ねらい：診断を受けたばかりで不安な人にも届くよう、気持ちの面から入る。「ゆっくり」で、急かさない世界観を出す。\n- 弱いところ：アプリだということが伝わりにくい。\n\n### パターン B「記録アプリ型」\n\n```\nCKDの猫の体調・補液・投薬を記録するアプリ公式\n飲水量やおしっこ、体重の変化を\nかかりつけの先生に見せやすい形に。\n獣医師監修｜運営者本人が獣医師です\n診察の代わりにはなりません\n▼アプリ（準備中）\n```\n\n- ねらい：何のアカウントなのかが一目でわかる。在宅ケア中で、記録に困っている人に向けた案。\n- 弱いところ：少し事務的に見える。ペットロスの話題とは相性がよくない。\n\n### パターン C「獣医師の顔が見える型」\n\n```\n獣医師がつくる、腎臓病の猫と飼い主さんの記録アプリ\n「これで合ってるかな？」に、やさしく正確に。\n・図解でわかる猫のCKD\n・お別れのことも、そっとお話しします\n個別の診療相談はお受けできません\n▼アプリ（準備中）\n```\n\n- ねらい：信頼感を前に出す。看取りやペットロスの話題も扱うことを、あらかじめ静かに伝えておく。\n- 弱いところ：「獣医師がつくる」と書くので、監修者の顔や名前をどこまで出すかを先に決める必要がある（§5）。\n\n### 3パターン共通の注意（ロシアンに確認したい点）\n- 補液については準備・環境の工夫に限り、手技の指導はしません。量や頻度は書きません（量や頻度は獣医師が決めるため）。\n- 「かかりつけの先生に見せやすい」は、アプリの機能（レポート）の説明です。診断に役立つとは書きません。\n- 「獣医師監修」と書くのは、監修の流れ（ユーザーが確認すること）を実際に回している間に限ります。\n\n---\n\n## 3. リンク欄\n\n| 時期 | リンク先 | 備考 |\n|---|---|---|\n| リリース前 | **Google Play の事前登録ページ**（ユーザー決定。メールアドレスは集めない） | iPhone の方には、リリースをこのアカウントで知らせると案内する |\n| リリース後 | App Store・Google Play、使い方のページ | リンクを複数並べる場合は、並び順をベンガルと決める |\n\n---\n\n## 4. ハイライト構成（案）\n\nカバーはすべて同じタッチの**ラインアートのアイコン**にします（`design_direction.md` を参照）。並びは左から順です。\n\n| # | ハイライト名 | 中身 | カバーの絵 |\n|---|---|---|---|\n| 1 | はじめに | このアカウントについて／監修者（運営者本人が獣医師）の開示／免責／コメント・DM のお願い（個別の診療相談はできません） | 手を振る猫 |\n| 2 | 補液 | 補液の準備・場所・声かけの工夫（手技は病院で習う前提）、ストーリーズの Q&A（量や頻度は扱わない） | 輸液バッグとしっぽ |\n| 3 | おくすり | 薬を飲ませるときの工夫（場所・タイミングなど） | 小さな錠剤と肉球 |\n| 4 | 検査値 | CRE・SDMA・リンなどの言葉の解説（「この値なら◯◯」とは言わない） | 小さなノート |\n| 5 | いつもとちがう | 飲水量・おしっこ・体重など、記録しておくとよい変化 | 水のお皿 |\n| 6 | Q&A | よくある質問をまとめたもの | 吹き出し |\n| 7 | アプリ | 使い方、リリース情報 | スマホと猫 |\n| 8 | こころ | 介護の疲れ、看取り、ペットロス（§5 で置くかどうかを決める） | 窓辺の日だまり（猫は描かない） |\n\n- 1〜7 は、情報が見つけやすいことを優先した並びです。\n- 8「こころ」は、いちばん右の目立たない位置に置きます。冒頭で「お別れのお話を含みます」と書いておき、見たい人だけが開ける形にします。\n- アプリのリリース前は、7「アプリ」を「準備中」の1枚だけにします。\n\n### 固定（ピン留め）する投稿の候補（3枠）\n1. 自己紹介（このアカウントの約束：判定はしない、怖がらせない、獣医師の指示を優先する）\n2. 「腎臓病と言われたら、まず知っておきたいこと」の図解（初回の目玉投稿）\n3. アプリの紹介（リリース後）。リリース前は「補液の準備のコツ」などのよく保存される投稿\n\n---\n\n## 5. ユーザーに選んでほしいこと\n\n| # | 決めること | 選択肢 | スコティのおすすめ |\n|---|---|---|---|\n| 1 | プロフィール文 | A 寄り添い型／B 記録アプリ型／C 獣医師の顔が見える型 | **A**（診断を受けたばかりの人にも届く。世界観と合う） |\n| 2 | 表示名 | a 腎臓病の猫と暮らす／b 猫のCKDケア記録／c 獣医師監修・猫の腎臓病 | **a** |\n| 3 | 監修獣医師（ユーザー）の見せ方 | ① 実名＋顔写真（またはイラスト）／② 実名だけ／③「獣医師」とだけ書く | **②か③**。顔を出すかどうかは負担を考えて決める。①にする場合はイラストの似顔絵もありえる |\n| 4 | 「こころ」のハイライト | 最初から置く／ペットロスの投稿がたまってから置く | **たまってから置く**（空のハイライトは置かない） |\n\n---\n\n## 出典・参照\n- プロジェクトの方針：`CLAUDE.md`、`docs/kickoff_answers.md`\n- Instagram の文字数制限などの仕様は、公開前に実際の画面で確認します（このファイルでは確認していません）。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}, {"id": "p1204", "title": "12/04 投稿「診断直後のあなたへ」を、監修獣医師として承認しますか？", "why": "ロシアンのレビューは通過しています。下の「本文を開く」で全文を確認できます。直したい箇所があれば、補足欄に書いてください。", "doc": "# 「腎臓病です」と言われた日のあなたへ\n\n- 予定日：2026-12-04（金）\n- ピラー：④ 飼い主さんの気持ちに寄り添う（＋② 獣医師との話し方）\n- 形式：カルーセル 8枚（縦 4:5）\n- 主に届けたい人：S1 診断直後の飼い主さん\n- 元にしたネタ：トレンドレポート 2026-11-09 #2（優先度 A）\n- レビュー状態：`compliance_reviewed`（ロシアン 2026-11-11。次は監修獣医師の確認）\n\n---\n\n## スライド構成\n\n配色は未定のため、色は「ベース／インク／メイン／アクセント」の役割だけで指定します（`design_direction.md` §2）。\n\n| 枚 | 見出し | 本文 | 絵・図解の指示 |\n|---|---|---|---|\n| 1 | 「腎臓病です」と言われた日のあなたへ | （本文なし） | 窓辺で丸くなって眠る猫と、そっと隣に座る飼い主さんの背中。余白を広く |\n| 2 | 頭が真っ白になって、当然です | 診察室で聞いたことを、あとから思い出せない。そんな方はたくさんいます。 | 小さな吹き出しが、ふわっと消えていく線画 |\n| 3 | 自分を責めなくて、大丈夫です | 猫の腎臓病は、シニア猫によく見られる病気のひとつです。今日から、できることを少しずつ。 | 猫が飼い主さんの手に頭をすり寄せる |\n| 4 | 次の診察で、聞いておきたいこと① | ・今の状態について、どう説明されたか（IRIS ステージなど）\\n・次の検査はいつ頃か\\n・ごはんはどうするか | チェックボックス付きのメモ帳（ペンは描かずにシンプルに） |\n| 5 | 聞いておきたいこと② | ・お薬や補液は必要か\\n・おうちで見ておくとよいこと\\n・急に様子が変わったときの連絡先 | 同じメモ帳の2ページ目 |\n| 6 | 聞いたことは、メモに残しておく | その場で全部わからなくても大丈夫。メモがあれば、あとで家族と共有したり、次の診察で聞き直したりできます。 | メモ帳と、スマホ（画面は描かない）と、猫のしっぽ |\n| 7 | 急に様子が変わったときは | 記録より先に、かかりつけの動物病院に相談してください。 | 電話のアイコンと、ふとんで休む猫（つらそうには描かない） |\n| 8 | ひとりで抱えなくて大丈夫 | このアカウントでは、毎日のケアのヒントを、ゆっくりお届けします。\\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。 | ナビゲーター猫のアイコンと、保存マーク |\n\n- 4・5枚目の質問リストは「保存したくなる」まとめとして作ります。\n- 3枚目の「シニア猫によく見られる」は、割合の数字を使わない表現にしています（出典のある数字が見つかるまで、数字は出しません）。\n- 「IRIS ステージ」は言葉の紹介だけにします。ステージごとの説明や数値はこの投稿では扱いません。\n\n## Canva での作り方\n- テンプレート：「Instagram 投稿（縦型 4:5）」1080×1350 を新規作成。全8ページを同じレイアウトで複製して使う。\n- 共通レイアウト：背景はベース色の1色。上から 180px あたりに見出し（テキストボックス1つ）、その下に本文、下の 1/3 に絵。四辺に 80px 以上の余白を残す。\n- 絵：Canva の「素材」で `cat line art`、`猫 線画`、`one line cat` などで探し、**線だけの素材** を選んでインク色に変える。人物は `hand line art`、`person back line` など。素材のタッチは投稿全体でそろえる（同じ作者の素材を使うと統一しやすい）。\n- 4・5枚目のチェックリスト：素材の `checkbox` か、角の丸い四角形（線のみ）を並べ、横にテキストを置く。\n- 8枚目：右下にナビゲーター猫のアイコン、その上に免責文（24px 以上）。\n- 商用利用の可否：使う素材が Canva のライセンスで SNS の商用投稿に使えるかを確認する（無料素材・Pro 素材とも）。\n\n## キャプション\n\n```\n「腎臓病です」と言われた日。\n帰り道のことを、よく覚えていない方も多いと思います。\n\n頭が真っ白になるのは、それだけうちの子を大切に思っているから。\nまずは深呼吸を。自分を責めなくて、大丈夫です。\n\n次の診察で聞いておきたいことを、リストにまとめました。\n4・5枚目を保存して、診察のときに見返してみてください。\n\n・今の状態について（IRISステージなど）\n・次の検査の時期\n・ごはんのこと\n・お薬や補液が必要かどうか\n・おうちで見ておくとよいこと\n・急に様子が変わったときの連絡先\n\n急に様子が変わったときは、記録より先に、かかりつけの動物病院にご相談ください。\n\nこのアカウントは、腎臓病の猫と暮らす飼い主さんのために、獣医師が運営・監修しています。\n個別の猫ちゃんのご相談にはお答えできないため、かかりつけの先生にご相談ください。\n\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。\n```\n\n## ハッシュタグ（13個）\n\n```\n#猫の腎臓病 #猫の慢性腎臓病 #腎臓病の猫 #腎臓病にゃんこ #猫の病気 #シニア猫 #老猫 #猫の健康 #猫の介護 #猫のいる暮らし #猫好きさんと繋がりたい #動物病院 #獣医師監修\n```\n- 大：#猫のいる暮らし #猫好きさんと繋がりたい #シニア猫\n- 中：#猫の病気 #猫の健康 #老猫 #動物病院 #猫の介護\n- 小：#猫の腎臓病 #猫の慢性腎臓病 #腎臓病の猫 #腎臓病にゃんこ #獣医師監修\n- ※ ハッシュタグごとの投稿件数は確認できていません（トレンドレポート §6）。規模の分類は推測です。\n\n## 代替テキスト（1枚目）\n「窓辺で眠る猫と、その隣に座る飼い主さんの線画。『腎臓病です』と言われた日のあなたへ、という文字。」\n\n## 出典\n- ISFM Consensus Guidelines on the Diagnosis and Management of Feline Chronic Kidney Disease（Sparkes AH ほか, Journal of Feline Medicine and Surgery, 2016）— 「シニア猫によく見られる」の根拠として使う予定。**要確認：該当箇所を原典で確認する**（ロシアン D-3）\n- IRIS（International Renal Interest Society）：IRIS Staging of CKD（iris-kidney.com）— ステージ分類があることの紹介に使う。**要確認：公開前に原典の最新版を確認する**\n- 質問リストは一般的な診察の準備としてスコティが作成したもの。医学的な主張は含まない（監修獣医師に内容を確認してもらう）\n\n## ロシアンに見てほしい点\n1. 3枚目「気づいた今日が、ケアのスタートです」が、早く気づけば結果が変わるという含み（罪悪感や効果の暗示）にならないか。\n2. 5枚目「お薬や補液は必要か」を質問に入れることが、治療を促しているように見えないか。\n3. キャプションの開示文「獣医師が運営・監修しています」の書き方（#23 の収益源・監修範囲は、固定投稿とプロフィールで示す想定）。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}, {"id": "p1208", "title": "12/08 投稿「冬の飲み場の工夫」を、監修獣医師として承認しますか？", "why": "ロシアンのレビューは通過しています。下の「本文を開く」で全文を確認できます。直したい箇所があれば、補足欄に書いてください。", "doc": "# 寒くなると、お水の減りがゆっくりに？（冬の飲み場の工夫と飲水の記録）\n\n- 予定日：2026-12-08（火）\n- ピラー：① 毎日のケアのコツ ＋ ③「いつもとちがう」に気づく・伝える\n- 形式：カルーセル 8枚（縦 4:5）\n- 主に届けたい人：S1 診断直後、S2 在宅ケア中\n- 元にしたネタ：トレンドレポート 2026-11-09 #1（優先度 A）\n- レビュー状態：`compliance_reviewed`（ロシアン 2026-11-11。次は監修獣医師の確認）\n\n---\n\n## 方針\n- **飲水量の「正常値」や「◯ml 以上」は出しません。** 情報源によって目安が大きく違うためです（トレンドレポート §5）。「その子のふだんと比べる」ことを伝えます。\n- 「脱水 → 悪化」のように怖がらせる流れにはしません。\n- ごはんの形（ドライかウェットか）を変えることは勧めません。療法食との兼ね合いがあるので、「かかりつけの先生に相談」とします。\n- 補液の量や回数には触れません。\n\n## スライド構成\n\n| 枚 | 見出し | 本文 | 絵・図解の指示 |\n|---|---|---|---|\n| 1 | 寒くなると、お水の減りがゆっくりに？ | （本文なし） | 水のお皿をのぞきこむ猫。窓の外に冬の葉 |\n| 2 | 寒い季節は、お水を飲みに行く回数が減る猫もいます | 寒い場所にある水飲み場には、足が向きにくい猫もいます。 | 寒い廊下と、あたたかい部屋で丸くなる猫の対比（寒さを強調しすぎない） |\n| 3 | 工夫① 飲み場を増やす | よく過ごす部屋や、寝床の近くにも。 | 家の簡単な見取り図に、お皿のマークが3つ |\n| 4 | 工夫② 器をいろいろ試す | 浅いお皿、陶器、流れる水など、好みは猫それぞれです。 | 3種類の器が並ぶ線画 |\n| 5 | 工夫③ いつも新鮮なお水を | こまめに取りかえて、器も清潔に。 | 水を注ぐ手と、しっぽ |\n| 6 | ごはんの形を変えたいときは | ドライからウェットへの変更などは、療法食との兼ね合いもあるので、かかりつけの先生に相談してから。 | ごはん皿と、はてなマークの吹き出し |\n| 7 | 「いつもとちがう」を記録しておく | 獣医師から量るように言われていなければ、量らなくても大丈夫。「いつもより多い・少ない」のメモだけでも、診察で伝えやすくなります。\\n急に飲まなくなった・食べなくなったなど、いつもと様子がちがって心配なときは、記録より先に、かかりつけの動物病院へ。 | ノートに「多い・ふつう・少ない」の3つの丸 |\n| 8 | まとめ | ・飲み場を増やす\\n・器を試す\\n・新鮮なお水を\\n・ごはんの変更は先生に相談\\n・ふだんとの違いをメモ\\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。 | 5つのアイコンが並ぶチェックリスト |\n\n## Canva での作り方\n- テンプレート：「Instagram 投稿（縦型 4:5）」1080×1350。全8ページ。\n- 3枚目の見取り図：角の丸い四角形（線のみ）を3〜4つ組み合わせて部屋に見立て、`water bowl line` の素材かシンプルな円を3か所に置く。\n- 4枚目の器：`bowl line art` などで3種類を横に並べる。給水器は特定の製品に見えないよう、ロゴやボタンのない形を選ぶ。\n- 7枚目の「多い・ふつう・少ない」：円（線のみ）を3つ横に並べ、下にテキスト。どれも同じ色にして、良い・悪いの意味を持たせない。\n- 8枚目のまとめ：アイコン5つを縦に並べたリスト。下に免責文（24px 以上）。\n- 素材の商用利用の可否は、使う前に確認する。\n\n## キャプション\n\n```\n寒くなってきて、お水のお皿がなかなか減らない…と感じていませんか？\n\n冬は、寒い場所にある水飲み場に足が向きにくくなる猫もいます。\nおうちでできる工夫を、まとめました。\n\n・よく過ごす部屋にも飲み場を\n・器の形や素材をいろいろ試す\n・こまめに新鮮なお水に\n\nごはんの形を変えたいときは、療法食との兼ね合いもあるので、かかりつけの先生に相談してからにしましょう。\n\n飲む量は、獣医師から量るように言われていなければ、量らなくても大丈夫。\n「いつもより多い・少ない」をメモしておくだけでも、診察のときに伝えやすくなります。\n急に飲まなくなった・食べなくなったなど、いつもと様子がちがって心配なときは、記録より先に、かかりつけの動物病院にご相談ください。\n\nあとで見返せるように、保存しておいてくださいね🐾\n\nこのアカウントは、腎臓病の猫と暮らす飼い主さんのために、獣医師が運営・監修しています。\n\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。\n```\n\n※ キャプションの「〜しましょう」は1回だけにしています（02 §5：「〜しましょう」を続けない）。\n\n## ハッシュタグ（14個）\n\n```\n#猫の腎臓病 #猫の慢性腎臓病 #腎臓病の猫 #腎臓病にゃんこ #猫の水分補給 #猫の飲水量 #猫の冬支度 #シニア猫 #老猫 #猫の健康 #猫の介護 #猫のいる暮らし #猫好きさんと繋がりたい #獣医師監修\n```\n- 大：#猫のいる暮らし #猫好きさんと繋がりたい #シニア猫\n- 中：#猫の健康 #老猫 #猫の介護 #猫の水分補給\n- 小：#猫の腎臓病 #猫の慢性腎臓病 #腎臓病の猫 #腎臓病にゃんこ #猫の飲水量 #猫の冬支度 #獣医師監修\n- ※ 投稿件数は確認できていないので、規模の分類は推測です。\n\n## 代替テキスト（1枚目）\n「水のお皿をのぞきこむ猫の線画。寒くなると、お水の減りがゆっくりに？という文字。」\n\n## 出典\n- ISFM Consensus Guidelines on the Diagnosis and Management of Feline Chronic Kidney Disease（Sparkes AH ほか, Journal of Feline Medicine and Surgery, 2016）— 水を飲みやすくする工夫（飲み場・器・新鮮な水など）の根拠として使う予定。**要確認：該当する箇所を原典で確認する**\n- IRIS Treatment Recommendations for CKD in Cats（iris-kidney.com）— 新鮮な水をいつでも飲めるようにしておくことの根拠として使う予定。**要確認：最新版の該当箇所**\n- 参考（メーカーの資料なので、根拠の主軸にはしない）：Purina Institute「CKD の猫の水分維持」（トレンドレポート §7）\n\n## ロシアンに見てほしい点\n1. 4枚目の「流れる水」が、特定の商品（給水器）を勧めているように見えないか。\n2. 6枚目の書き方で、療法食をやめたり変えたりするよう促しているように読めないか。\n3. 7枚目の「急に飲まない・食べないときは」が、症状ごとの受診基準（判定）にあたらないか（要件レビュー #19 の考え方と合っているか）。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}, {"id": "p1211", "title": "12/11 投稿「AIM の薬の現状 Q&A」を、監修獣医師として承認しますか？", "why": "ロシアンのレビューは通過しています。下の「本文を開く」で全文を確認できます。直したい箇所があれば、補足欄に書いてください。", "doc": "# 話題の「AIM」の薬、いまどうなっている？（Q&A）\n\n- 予定日：2026-12-11（金）\n- ピラー：② 検査値・医療情報のやさしい解説\n- 形式：Q&A カルーセル 7枚（縦 4:5）\n- 主に届けたい人：S1 診断直後、S2 在宅ケア中\n- 元にしたネタ：トレンドレポート 2026-11-09 #3（優先度 A）\n- レビュー状態：`compliance_reviewed`（ロシアン 2026-11-11。公開前日に承認状況を確認し、変わっていればレビューに戻す。次は監修獣医師の確認）\n- ⚠️ **公開の前日に、承認状況を公式発表で再確認すること。** 状況が変わっていたら、文面を作り直してからロシアンのレビューに戻します。\n\n---\n\n## 方針（いちばん大事なところ）\n- **承認前の動物用医薬品の広告と受け取られないようにする。** 薬機法では、承認前の医薬品の名称や効能・効果の広告が禁じられています（動物用医薬品にも準用。**ロシアンに要確認**）。そのため、\n  - 製品名（ブランド名）は見出しや1枚目に出さない。本文でも出すかどうかはロシアンの判断を待つ（下の案は製品名なし）\n  - 効き目や「治る」「希望」を思わせる言葉を使わない\n  - **製品名・開発会社のブランド名は、本文・画像・ハッシュタグのどこにも出さない**（出典欄に発表元の名前と URL を書くのは可：ロシアン I-1）\n  - 効き目や仕組み（「腎臓の働きを〜」など）は一切書かない（I-1）\n  - 同じ投稿の中に、プロフィールのリンクやアプリの事前登録の案内を並べない（I-1）\n  - 「期待」「画期的」などの期待をあおる言葉を使わない。アプリの宣伝と結び付けない（ロシアンのマーケレビュー #19）\n  - 出典（発表元・日付）と、確認した日の状況を投稿の中に書く（同 #19）\n- 期待をあおらず、「今わかっていること」と「今できること」の交通整理に徹します。\n- 「AIM」と名前のつくフードやサプリについては、特定の商品を批判せず、「薬とは別のもの」とだけ伝えます。\n\n## スライド構成\n\n| 枚 | 見出し | 本文 | 絵・図解の指示 |\n|---|---|---|---|\n| 1 | 話題の「AIM」の薬、いまどうなっている？ | （本文なし） | ニュースの紙面を眺める猫。期待をあおる演出（光・キラキラ）はしない |\n| 2 | Q. AIM って何？ | 体の中にもともとある、たんぱく質のひとつです。猫の腎臓病との関わりについて、研究が進められています。 | 小さな丸（たんぱく質）を図案化したシンプルな線画 |\n| 3 | Q. 薬は、もう使えるの？ | 2026年4月に、国へ製造販売の承認申請が出されたと発表されています。\\n◯月◯日時点で、承認・発売の発表は確認できていません。 | カレンダーと砂時計 |\n| 4 | Q. 「AIM」と名前のつくフードやサプリは？ | 申請中の薬とは別のものです。食品やサプリメントは、病気の治療薬として国の承認を受けたものではありません。 | 薬のびんとフード袋を、線で区切って並べる（商品名・ロゴは描かない） |\n| 5 | Q. 今、できることは？ | 今の治療やごはん、補液を自己判断で変えたり、やめたりしないこと。気になることは、かかりつけの先生に聞いてみてください。 | 猫と飼い主さんが動物病院の受付にいる |\n| 6 | Q. これから、どうなるの？ | 承認されるかどうか、いつになるかは、まだ発表されていません。状況に変化があれば、このアカウントでもお知らせします。治療の方針は、これまでどおり、かかりつけの先生と相談してください。 | 診察台の猫と、話を聞く飼い主さん（獣医師は後ろ姿） |\n| 7 | まとめ | ・AIM の薬は承認申請中（◯月◯日時点）\\n・AIM の名前のつく食品は、薬とは別のもの\\n・今の治療は自己判断で変えない\\n・気になったら、かかりつけの先生へ\\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。 | 4つのアイコンのチェックリスト |\n\n- 「◯月◯日時点」は、公開直前に確認した日付を入れます。\n- 2枚目の「たんぱく質のひとつ」は、一次資料で確認できなければ「研究が進められている物質です」だけにします（ロシアン I-6）。\n\n## Canva での作り方\n- テンプレート：「Instagram 投稿（縦型 4:5）」1080×1350。全7ページ。\n- Q&A の型：上に「Q.」＋質問（見出し）、区切り線、下に答え（本文）。全ページ同じ位置にそろえる。\n- 2枚目の「たんぱく質」：円を3〜4つ重ねただけの抽象的な図で十分。分子模型などのリアルな素材は使わない。\n- 4枚目：縦の区切り線の左右に、薬のびん（`medicine bottle line`）とフード袋（`food bag line`）。**ラベルや商品名・ロゴのない素材** を選ぶ。\n- キラキラ・光・矢印で上向きを示すなど、期待をあおる飾りは使わない。\n- 7枚目：確認した日付と出典（発表元・日付）を、免責文の上に小さく入れる。\n- 素材の商用利用の可否は、使う前に確認する。\n\n## キャプション\n\n```\n最近よく耳にする「AIM」の薬について、いまの状況をQ&Aでまとめました。\n\n・2026年4月に、製造販売の承認申請が出されたと発表されています\n・◯月◯日時点で、承認・発売の発表は確認できていません\n・「AIM」と名前のつくフードやサプリは、申請中の薬とは別のものです\n\n新しいニュースを見ると、気持ちが揺れますよね。\nいまの治療やごはん、補液は、自己判断で変えたりやめたりせず、気になることはかかりつけの先生に聞いてみてください。\n\n状況に変化があれば、このアカウントでもお知らせします。\n\nこのアカウントは、腎臓病の猫と暮らす飼い主さんのために、獣医師が運営・監修しています。\n\n※一般的な情報です。治療・ごはん・補液の内容は猫ちゃんの状態により異なるため、かかりつけの獣医師にご相談ください。\n```\n\n## ハッシュタグ（11個）\n\n```\n#猫の腎臓病 #猫の慢性腎臓病 #腎臓病の猫 #腎臓病にゃんこ #AIM #シニア猫 #猫の健康 #猫の病気 #猫のいる暮らし #猫好きさんと繋がりたい #獣医師監修\n```\n- 製品名のハッシュタグ（例：ブランド名のカタカナ表記）は付けません（承認前の医薬品の広告と受け取られないため）。#AIM を付けるかどうかもロシアンに確認します。\n- 投稿件数は確認できていないので、規模の分類は推測です。\n\n## 代替テキスト（1枚目）\n「ニュースの紙面を眺める猫の線画。話題の『AIM』の薬、いまどうなっている？という文字。」\n\n## 出典（公開直前にすべて再確認）\n- AIM医学研究所（IAM CAT）「AIM猫薬の製造販売承認申請に関するお知らせ」2026-04-24（https://iamaim.jp/2026/04/24/news0424/）— 申請の事実の出典。**要確認：公開前日に、承認の発表がないかを同じサイトと農林水産省の発表で確認する**\n- 農林水産省 動物医薬品検査所の承認情報 — **要確認：承認された動物用医薬品を確認できるページの URL**\n- AIM が体内にあるたんぱく質であることの出典 — **要確認：論文または研究機関の公式ページを一次資料として探す**（トレンドレポートの出典は二次情報が中心のため）\n\n## ロシアンに見てほしい点\n1. この投稿全体が、承認前の動物用医薬品の広告（薬機法）にあたらないか。製品名を本文に出してよいか。\n2. 4枚目「病気の治療を目的としたものではありません」が、特定の食品・サプリへの批判や、逆に食品の効能表示に見えないか。\n3. 6枚目「新しい発表があれば、お知らせします」が、発売への期待をあおる表現にならないか。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}, {"id": "cal", "title": "12月の投稿カレンダーを、監修獣医師として承認しますか？", "why": "ロシアンのレビューは通過しています。下の「本文を開く」で全文を確認できます。直したい箇所があれば、補足欄に書いてください。", "doc": "# Instagram 投稿カレンダー 2026年12月（案）\n\n- ステータス：`compliance_reviewed`（ロシアン 2026-11-11。未着手の投稿は作成後に個別レビュー）\n- 作成：スコティ／2026-11-09\n- 前提：ユーザーの決定（`docs/marketing_decisions.html` の回答）、`docs/compliance/review_2026-11-09_marketing.md`（#1・#18・#19・#23）、`docs/marketing/02_positioning.md`（§2 ターゲティング、§5 メッセージハウス）、`docs/sns/trends/2026-11-09.md`、`docs/compliance/review_2026-11-09_requirements.md`（#13・#20）、`profile.md`、`design_direction.md`\n- 公開までの流れ：スコティ作成 → ロシアンのレビュー → 監修獣医師（ユーザー）の確認 → 予約公開\n\n> 配色・猫の描き方・プロフィール文は、ユーザーが「Instagram デザイン選択」シートで選んでいるところです。このカレンダーと投稿案は、**配色に左右されない構成と文面だけ** を先に作っています。\n> アカウントの開設日はまだ決まっていません。ここでは **12/1（火）開設** と仮置きしています。\n\n---\n\n## 方針\n\n| 項目 | 内容 |\n|---|---|\n| 本数 | 週2本（火・金）＋ときどきストーリーズ。12月はフィードに 9本 |\n| 獲得（S1 診断直後） | ② 診断直後、① 冬の水分補給、③ AIM 薬の現状 で入口をつくる |\n| 継続（S2 在宅ケア中） | 補液・投薬・記録・年末年始の休診の備え |\n| 看取り・ペットロス | **12月は扱わない。** S4 は獲得の対象にしないため（02 §1）。トーンのルールとロシアンの #13 が固まってから、静かに始める |\n| 使わない言葉 | 「長く」「長生き」「少しでも長く一緒に」（ロシアンの #20）、「手遅れ」「放置すると」「◯割の猫が」（02 §5） |\n| 出典のない数値 | 使わない。飲水量の「正常値」も出さない（トレンドレポート §5） |\n| コア・メッセージ | **「腎臓病の猫との毎日を、ゆっくり記録する。」**（ユーザー決定：マーケ確認シート）。投稿の言葉づかいもこれに合わせ、「ゆっくり」「急がなくていい」を基調にする |\n| アプリへの導線 | リリース前は **Google Play の事前登録だけ**（ユーザー決定）。iPhone の方には「リリースはこのアカウントでお知らせします」と案内する。12月は売り込まず、導線はプロフィールのリンクに置くだけ |\n| 制作体制 | 画像は **ユーザー本人が Canva で作る**。予算はほぼゼロ。各投稿に「Canva での作り方」を付ける。本数は週2本を基本にし、週3本を上限にする |\n| 体験談・UGC | 公式で紹介するのは **使い勝手の感想だけ**。猫の体調・検査値の変化には触れない。本人の許可と写真の許可は別々に取る（ロシアンのマーケレビュー #18） |\n| 避ける言い方 | 「これだけ見ておけば大丈夫」のように、記録項目だけ見ていれば十分と読める表現（マーケレビュー #1）。記録の話は「よく記録される項目」「何を記録するかは、かかりつけの獣医師と相談しながら」と書く |\n\nピラー：①毎日のケアのコツ ②検査値のやさしい解説 ③「いつもとちがう」に気づく・伝える ④飼い主さんの気持ちに寄り添う ⑤アプリ／アカウントのこと\n\n---\n\n## カレンダー\n\n| 日付 | ピラー | 形式 | テーマ（仮タイトル） | 主に届けたい人 | 元にしたネタ | ステータス |\n|---|---|---|---|---|---|---|\n| 12/1（火） | ⑤ | カルーセル | **はじめまして｜このアカウントの約束**（判定しない、怖がらせない、獣医師の指示を優先する。運営者が獣医師であることの開示）※固定投稿 | 全員 | profile.md | 未着手（開示文の案は下の「固定投稿の開示文」。氏名を出すかはユーザーの選択待ち）。**この投稿を最初に公開し、それまでほかの投稿は出さない**（D-5） |\n| 12/4（金） | ④ | カルーセル | **「腎臓病です」と言われた日のあなたへ**（気持ちの受け止め方と、獣医師に聞いておきたい質問のリスト） | S1 | トレンド #2（A） | **draft あり** → `posts/2026-12-04_diagnosis-first-day.md` |\n| 12/8（火） | ③① | カルーセル | **寒くなると、お水の減りがゆっくりに？**（冬の飲み場の工夫と、飲水の記録のしかた） | S1・S2 | トレンド #1（A） | **draft あり** → `posts/2026-12-08_winter-hydration.md` |\n| 12/11（金） | ② | Q&A カルーセル | **話題の「AIM」の薬、いまどうなっている？**（申請中で未承認、フードやサプリとは別もの、今の治療は自己判断で変えない） | S1・S2 | トレンド #3（A） | **draft あり** → `posts/2026-12-11_aim-update.md`（**公開直前に承認状況を再確認**） |\n| 12/13（日） | ⑤ | ストーリーズ | 質問箱「CKD のケアで知りたいこと、教えてください」 | 全員 | — | 未着手。画面に「個別の猫ちゃんのご相談にはお答えできません」と明記する。取り上げるのは一般的な情報で答えられる質問だけ。質問文は特定されないよう要約し、回答も公開前にロシアン → 監修獣医師へ（C-3）。返信の定型文は `reply_templates.md` |\n| 12/15（火） | ③ | カルーセル | **「いつもとちがう」を、先生に伝えやすく**（食欲・飲水・おしっこ・体重のメモの例） | S1・S2 | トレンド #8（B） | 未着手 |\n| 12/18（金） | ①④ | リール | **補液がこわいのは、あなただけじゃない**（準備・場所・声かけの工夫。手技は病院で習う前提） | S2 | トレンド #4（B） | 未着手。針を刺す場面・部位・量・速さは映さない。台本の段階でレビューに回す（C-7） |\n| 12/22（火） | ① | カルーセル | **年末年始の休診に備えるチェックリスト**（休診日の確認、「かかりつけの先生に休診中の連絡のしかたを聞いておく」、補液やお薬の残りの確認、記録のコピー） | S2 | スコティのオリジナル | 未着手。症状は並べない。特定の夜間救急病院の名前は出さない（C-5） |\n| 12/25（金） | ① | カルーセル | **お薬タイムを「戦い」にしないために**（場所・2人で・補助用品。混ぜてよいかは製品と獣医師次第） | S2 | トレンド #6（B） | 未着手。製品名・購入リンクは出さない（C-6） |\n| 12/29（火） | ④ | 1枚画像＋キャプション | **今年もおつかれさまでした**（毎日のケアへのねぎらい。休むことも大事。お別れの話題には触れない） | S2 | — | 未着手 |\n\n- 年末年始（12/30〜1/3）は投稿を止めます。急なトラブルがあっても、コメントや DM にすぐ対応できないためです。\n- 1月から準備を始めるもの：猫の日（2/22）と世界腎臓デー（2027年は 3/11。トレンドレポートより、要確認）の企画。世界腎臓デーは **人の腎臓の日であることを明記** し、「うちの子の記録を見返すきっかけに」という形で扱う。有病率の数字では始めない（マーケレビュー #23）。検査値の項目の解説（トレンド #7。IRIS の原典を確認してから）。\n\n## 固定投稿（12/1）の開示文（案：マーケレビュー #11 の確定案）\n\n> このアカウントは、獣医師 ◯◯ が運営・監修しています。投稿の内容は、外部の獣医師にも確認を依頼しています。監修は一般的な情報の確認で、個別の猫ちゃんの診療やご相談には応じていません。将来、ペットフードメーカーの広告・協賛を掲載する予定です。\n\n- **決定（2026-11-11）**：氏名は **実名だけ** 出す（顔は出さない）。氏名はまだ受け取っていないので「◯◯」のまま。\n- **決定**：外部の獣医師にもチェックを依頼すること、収益源を書くこと。2文目は、外部の獣医師への依頼が実際に始まってから入れる（始まるまでは削る）。この2文目はロシアンの再確認が必要。\n- 広告を始めたら、最後の文を「運営費の一部は、ペットフードメーカー（◯◯社ほか）の広告・協賛でまかなっています。」に差し替える。\n- 「このアカウントの約束」に入れる4点：①判定・診断をしない ②怖がらせない ③治療・ごはん・補液はかかりつけの獣医師の指示を優先 ④個別のご相談にはお答えできない（DM・コメントも）\n\n## ピラー名（ロシアン C-4：「早めに気づきたいサイン」の言い換え）\n\n**決定（2026-11-11）：a「いつもとちがう」に気づく・伝える**。以下は検討の記録です。\n\n「早めに気づけば結果が変わる」という含みをなくすための案です。\n\n| 案 | ピラー名 | ひとこと |\n|---|---|---|\n| a | 「いつもとちがう」に気づく・伝える | ロシアンの案。記録→先生に伝える、というアプリの役割とつながる（スコティのおすすめ。仮でこれを使っています） |\n| b | ふだんの様子を、見て・残す | 「気づく」を使わず、観察と記録に寄せる |\n| c | 先生に伝えたい、毎日の変化 | 獣医師との橋渡しを前に出す |\n\nあわせて、ハイライト5「気づきたい」も、選ばれた案に合わせて「いつもとちがう」などに変えます（`profile.md`）。\n\n## 予約公開の前に確認すること（毎回）\n- [ ] ロシアンのレビューが済んでいる（`compliance_reviewed`）\n- [ ] 監修獣医師（ユーザー）の確認が済んでいる（`approved`）\n- [ ] 承認のあとで変更した場合は、レビューからやり直した（C-8）\n- [ ] （開設前のみ）固定投稿の開示と、コメント・DM の定型文（`reply_templates.md`）が用意されている（C-1・C-2）\n- [ ] 公開日の前後に、大きな災害やつらいニュースがない（あれば止める。**止める担当はユーザー本人**：決定 2026-11-11）\n- [ ] 時事ネタ（AIM など）は、公開の前日に最新の公式発表を確認した\n\n## ロシアンに見てほしい点（カレンダー全体）\n1. 12/11 の AIM の投稿は、**承認前の動物用医薬品の広告**（薬機法）と受け取られないか。製品名を出すかどうかも含めて見てほしい。\n2. 12/22 の「休診に備える」で、「救急の連絡先を確認しておく」と書くことが、受診基準を示す判定にあたらないか。\n3. 12/1 の開示文（運営者が獣医師であること・収益源・監修の範囲。#23）の文案。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}, {"id": "tmpl", "title": "コメント・DM・質問箱の返信テンプレートを、監修獣医師として承認しますか？", "why": "ロシアンのレビューは通過しています。下の「本文を開く」で全文を確認できます。直したい箇所があれば、補足欄に書いてください。", "doc": "# コメント・DM・質問箱の返信テンプレート（案）\n\n- ステータス：`compliance_reviewed`（ロシアン 2026-11-11。【要確認】の窓口は確認できるまで送らない。次は監修獣医師〔ユーザー〕の確認）\n- 作成：スコティ／2026-11-11\n- きっかけ：ロシアン「Instagram 12月分レビュー」C-2・C-3（`docs/compliance/review_2026-11-09_instagram_dec.md`）。**アカウント開設の条件**になっています。\n- 前提：`CLAUDE.md`、`design_direction.md` §6（ペットロスのトーン）、`calendar_2026-12.md`\n\n---\n\n> ⚠️ **アカウント開設の条件**：T-9b の「公開前チェック」が済んでいること。窓口の確認は 2026-11-11 に済み。残りは、①開設日の再確認（スコティかロシアン）と、②監修獣医師（ユーザー）によるテンプレート全体の承認。\n\n## 0. 基本のルール\n\n| ルール | 理由 |\n|---|---|\n| **個別の猫の状態の判断・診断・治療の提案はしない**（数値の評価、ステージ、薬や補液の量、受診すべきかどうかの判断） | 獣医師法（無診察での診療の禁止など）。運営者が獣医師であっても、SNS 上では診察をしない |\n| **安心させる言葉も判断にあたるので使わない**（例：「様子を見て大丈夫」「心配ないと思います」「よくあることです」「その数値なら問題ない」） | 善意の言葉でも、個別の猫の状態についての判定になる（ロシアン R-1） |\n| 詳しい症状や検査値を **こちらから聞かない** | 聞くと個別相談の流れになる。個人情報が増える |\n| 返信は短く、あたたかく。決まり文句でも、最初の一文は相手の言葉を受け止める | 冷たく突き放されたと感じさせない |\n| 「長く」「長生き」「治る」「良くなる」「手遅れ」「虹の橋」は使わない | ロシアンの要件レビュー #13・#20、02 §5 |\n| 特定の製品名・病院名・購入先は出さない | 中立性。承認前の医薬品の広告にあたるおそれ（AIM など） |\n| 返信するのはユーザー（監修獣医師）。テンプレートにない内容は、その場で返さずに保留する | 判断のぶれを防ぐ |\n| 個人や猫が特定される情報（地名・病院名・猫の写真つきの病状）がコメントにあったら、非表示にしたうえで、DM でその理由をやさしく伝える | プライバシー |\n\n`【】` の部分は、状況に合わせて入れ替えます。\n\n---\n\n## 1. コメント・DM の返信\n\n### T-1 個別の相談（コメント欄）\n```\nコメントありがとうございます。【うちの子のことを思うと、心配になりますよね】。\n個別の猫ちゃんの状態については、このアカウントではお答えできないため、かかりつけの先生にご相談ください🐾\n```\n\n### T-2 個別の相談（DM）\n```\nメッセージありがとうございます。\n【ご心配な気持ち、お察しします】。\n\nこのアカウントは一般的な情報をお届けするためのもので、個別の猫ちゃんの状態についてのご相談にはお答えできません。\nかかりつけの先生に、今日のメッセージの内容をそのまま伝えてみてください。\n\n急に様子が変わったときは、記録より先に、かかりつけの動物病院にご相談ください。\n```\n\n### T-3 急ぎに見える相談（「ぐったりしている」「何も食べない」など）\n**すぐに返します。** 症状の重さは判断しません。\n```\nメッセージありがとうございます。\nこのアカウントでは、猫ちゃんの状態を判断することができません。\nいつもと様子がちがって心配なときは、すぐに、かかりつけの動物病院にご連絡ください。\n休診の時間であれば、かかりつけの先生から案内されている連絡先にご相談ください。\n```\n- 特定の夜間救急病院の名前は出しません（ロシアン C-5）。\n\n### T-4 検査値を書いて「大丈夫ですか？」と聞かれた\n```\n数値を見ると、気持ちが落ち着かなくなりますよね。\n検査の結果は、ほかの検査や猫ちゃんの様子とあわせて見るものなので、このアカウントでは良い・悪いをお伝えすることができません。\n次の診察で、かかりつけの先生に「この数値はどう考えればいいですか？」と聞いてみてください。\n```\n\n### T-5 補液・お薬の量や回数、やめてよいかを聞かれた\n```\n毎日のケア、本当におつかれさまです。\n補液やお薬の量・回数は、猫ちゃんの状態を診ているかかりつけの先生が決めるものなので、このアカウントではお答えできません。\n変えたい・やめたいと感じたときは、自己判断で変えずに、まず先生に相談してみてください。\n```\n\n### T-6 特定のフード・サプリ・新しい薬（AIM など）について聞かれた\n```\n気になりますよね。\nこのアカウントでは、特定の商品についてのご案内はしていません。\n今の治療やごはんとの組み合わせも含めて、使う前にかかりつけの先生に相談してみてください。\n```\n- AIM の薬については、「承認の状況は、【確認した日】時点で発表されていません」以上のことは書きません（ロシアン I-1〜I-4）。\n\n### T-7 感謝・共感のコメント\n```\nうれしいお言葉、ありがとうございます。【うちの子】との毎日が、少しでも穏やかでありますように🐾\n```\n- 「うちの子と少しでも長く」とは書きません。\n\n### T-8 悲しみ・お別れのコメント\n決まり文句ではなく、短く。アプリやほかの投稿の案内はしません。\n```\n大切なお話を聞かせてくださって、ありがとうございます。\n【◯◯ちゃん】は、たくさんの想いに包まれていたのだと思います。\n```\n- 相手が使っている言葉（「お空」「虹の橋」など）には合わせてかまいません。こちらから使うのは避けます。\n- 「もっと早く」「〜していれば」に、こちらから触れません。\n\n### T-9 自分を強く責めている・とてもつらそうなコメントや DM\n```\nそんなふうに感じてしまうほど、【◯◯ちゃん】のことを大切に思っていらっしゃるのだと思います。\n【◯◯ちゃん】と一緒に過ごしてきた時間と、その想いは、きっと伝わっていたと思います。\n\nつらさが続くときは、ひとりで抱えずに、身近な人や相談できる窓口に話してみてください。\n【ペットロスの相談先：要確認】\n```\n- 2行目はロシアンの例文です（R-2）。最終的な文言は監修獣医師と決めます。\n- 安楽死・治療の中止など、**飼い主さんの個別の選択には触れません**。直接聞かれた場合も評価はせず、T-8 に近い受け止めの言葉だけを返します。\n- 【ペットロスの相談先】は、非営利・公的なものを優先して探します。実在していて、今も受け付けていることを確かめるまでは【要確認】のままにし、その行は消して送ります。\n- 探した記録：2026-11-11、Web 検索（「ペットロス 相談窓口 公益社団法人／獣医師会／大学」）。見つかったのは個人の有料サービスだけで、非営利・公的な窓口の公式情報は見つからなかった。次は、都道府県の獣医師会、大学の動物病院、自治体の動物愛護の担当部署の公式サイトを直接あたる。見つかったら、ロシアンのレビューに回す。\n- 命の危険をうかがわせる言葉があるときは、T-9 ではなく **T-9b** を使います。\n\n### T-9b 命の危険をうかがわせる言葉があるとき（「もう生きていたくない」など）\n**見つけたらすぐに返します。** 受け止めの一文と、公的な相談窓口の案内だけにします。ペットや病気の話題には広げません。\n```\nつらい気持ちを話してくださって、ありがとうございます。\n今のお気持ちを、ひとりで抱えないでください。\n国（厚生労働省）が案内している窓口で、電話やSNSで話を聞いてもらえます。\n・#いのちSOS 0120-061-338（24時間・無料）\n・よりそいホットライン 0120-279-338（24時間・無料）\n・ほかの窓口やSNS相談：厚生労働省「まもろうよ こころ」 https://www.mhlw.go.jp/mamorouyokokoro/\n今すぐ命の危険があるときは、119番（救急）に連絡してください。\n```\n- 文面はロシアンの推奨案です（`review_2026-11-11_instagram_v2.md` 追記2）。\n- **確認日：2026-11-11**。番号と受付時間は、この日の厚生労働省の電話相談窓口のページ（https://www.mhlw.go.jp/mamorouyokokoro/soudan/tel/）の表記です。スコティとロシアンがそれぞれページを開いて確認しました。\n- 案内するのは、**公的機関が案内している窓口だけ**です（ロシアン R-3）。\n- 子ども向けの窓口（チャイルドライン、24時間子供SOSダイヤルなど）も同じページにあります。相手が子どもだとわかったときは、ユーザーが同じページから選んで案内します。\n- DM はユーザーが手で返す運用なので（ユーザー決定）、夜間や休止中はすぐに返せません。T-9b の言葉を見つけたら、気づいた時点ですぐに返します。\n- 対応したことは記録に残します（日時・返信した内容。相手の名前は記録しない）。\n\n#### 公開前チェック（T-9b・アカウント開設の条件）\n- [x] 案内する窓口の名前・番号・受付時間を、厚生労働省のページ（一次情報）で確認した（確認日：**2026-11-11**、スコティ・ロシアン）\n- [x] テンプレートの窓口を、確認した表記に合わせて書き換えた（ロシアンの推奨文案）\n- [ ] **アカウント開設日に、もう一度だけ確認する**（担当：スコティかロシアン）。ページが更新されていないかを見る。確認日：【　　　　】\n- [ ] **監修獣医師（ユーザー）が、テンプレート全体を承認した**（運営者としての最終承認。事実確認とは別）\n\n#### 定期的な確認（運用）\n- **半年に1回**（次回の目安：2027年5月）と、窓口の変更が報じられたときに、上の厚生労働省のページで番号と受付時間を確認し直す。\n- 確認したら、上の「確認日」を書き換える。表記が変わっていたら、テンプレートを直してからロシアンに確認してもらう。\n\n### T-10 誤った情報を含むコメント（例：猫に危ない食べもの・植物をすすめている）\n```\nコメントありがとうございます。\n【ユリ】は猫にとって危険な植物とされているため、念のためお知らせさせてください。気になることがあれば、かかりつけの先生にご相談ください。\n```\n- 言い争いはしません。\n\n#### 非表示にするかどうかの基準（ロシアン R-4）\n| 非表示にする | 非表示にしない |\n|---|---|\n| ① 猫に有害なもの（植物・食べもの・人の薬など）をすすめている | 意見の違い |\n| ② 治療・補液・投薬を自己判断でやめる・変えるようすすめている | アカウントや投稿への批判 |\n| ③ 特定の商品に、病気への効き目があるとうたっている | 自分の猫の経験を話しているだけのコメント（①〜⑤にあたらないもの） |\n| ④ 個人や猫が特定される情報（地名・病院名・連絡先など） | |\n| ⑤ 誹謗中傷 | |\n\n- ①〜③は、ほかの人のために、T-10 の返信をしてから非表示にする。④は非表示にしてから、DM で理由をやさしく伝える。⑤は返信しない。\n- **非表示にしたものは記録に残す**：日時、投稿、どの基準（①〜⑤）にあたったか、返信したかどうか。記録の置き場所はユーザーと決める（リポジトリには個人情報を置かない）。\n- 根拠を示すときは一次情報の出典を使います。\n\n### T-11 批判・ご意見\n```\nご意見ありがとうございます。いただいた内容は、今後の発信の参考にさせていただきます。\n```\n- 事実の誤りを指摘された場合は、ユーザーとロシアンが確認し、必要なら投稿を訂正します。\n\n### T-12 広告・PR・取材の依頼（DM）\n```\nご連絡ありがとうございます。担当者から改めてご返信いたします。\n```\n- 中身の判断はユーザーが行います。\n- **広告の方針（NFR-ADS-09・10）が決まるまでは、商品の提供や有償の依頼は受けません**（ロシアン R-5）。取材は受けてよいですが、話す内容は投稿と同じく、獣医師法・中立性のルールに従います。\n- 広告を始めたあとの PR 投稿は、ロシアンのレビューを通し、「PR」「広告」と表示します。\n\n### T-13 体験談・写真の紹介の許可をお願いするとき\n```\nすてきな投稿をありがとうございます。\nもしよろしければ、このアカウントで【ご感想】を紹介させていただけないでしょうか。\n・ご紹介する文章：【引用する文】\n・写真の使用：【使う／使わない】（写真を使う場合は、別にお許しをいただきたいです）\nお断りいただいても、まったく問題ありません。\nあとから取り下げたくなった場合も、いつでもご連絡ください。\n```\n- 許可のやりとり（DM）は保存しておきます（ロシアン R-6）。\n- 紹介するのは **使い勝手の感想だけ** です。猫の体調・検査値の変化には触れません（ロシアン マーケレビュー #18）。\n- 文章の許可と、写真の許可は **別々に** もらいます。\n- 闘病中や亡くなった猫の写真は、飼い主さんがはっきり希望したときだけ使います。\n\n---\n\n## 2. 自動返信・休止中の案内\n\n### T-14 DM の自動返信（いつも）— **使わない**（ユーザー決定：DM はテンプレートを見ながら手で返す。将来使うときのために残しておく）\n```\nメッセージありがとうございます。\nこのアカウントでは、個別の猫ちゃんの状態についてのご相談にはお答えできません。個別のご相談には、お返事ができないこともあります。\n急に様子が変わったときは、かかりつけの動物病院にご相談ください。\n```\n\n### T-15 年末年始など、投稿とお返事を休むとき（例：12/30〜1/3）\n```\nメッセージありがとうございます。\n【12月30日〜1月3日】はお休みをいただいており、お返事は【1月4日】以降になります。\n急に様子が変わったときは、かかりつけの動物病院、または先生から案内されている休診中の連絡先にご相談ください。\n```\n- Instagram（Meta Business Suite）の自動返信機能で、どこまで設定できるかは開設前に確認します（推測：プロアカウントのクイック返信・自動返信が使える）。\n\n---\n\n## 3. 質問箱（ストーリーズ）\n\n### T-16 質問箱の画面に入れる文\n```\nCKDのケアで、知りたいことを教えてください🐾\n※個別の猫ちゃんのご相談（検査値・症状・お薬の量など）にはお答えできません\n```\n\n### 取り上げるときのルール（ロシアン C-3）\n1. 一般的な情報で答えられる質問だけを選ぶ。\n2. 質問の文は、個人や猫が特定されないよう要約してから載せる（スクリーンショットをそのまま使わない）。\n3. 回答の文面も、公開前にロシアン → 監修獣医師の確認を通す。\n4. 個別の相談だった質問には、取り上げずに T-2 の DM を送る（返信するかどうかはユーザーが判断）。\n\n---\n\n## ロシアンに見てほしい点\n1. T-3 で「すぐに、かかりつけの動物病院に」と書くことが、受診の判断（判定）にあたらないか。\n2. T-9 の「どの選択も、うちの子を想って選んだものです」が、個別の選択（安楽死など）の評価に読めないか。\n3. T-10 で、危険な情報を訂正するときの書き方と、非表示にする基準。\n\n## ユーザー（監修獣医師）に決めてほしい点\n1. ~~DM の返し方~~ → **決定：テンプレートを見ながら手で返す**（2026-11-11）\n2. ~~相談窓口~~ → **決定：実在を確認できたものだけを載せる**（2026-11-11）。T-9b は厚生労働省のページで確認済み（2026-11-11、ロシアンの推奨文案に差し替え）。T-9 のペットロスの相談先は探している途中\n3. 返信までの目安の時間を、プロフィールや自動返信に書くか（書かないのがスコティのおすすめ。約束できないため）。\n", "cats": ["スコティ"], "opts": [["ok", "承認する", "このまま公開候補にする"], ["fix", "直してほしい箇所がある", "補足欄に箇所と直し方を書いてください"], ["later", "あとで見る", "今回は保留"]]}];
const state = {answers:{}, notes:{}, free:""};
const $ = s=>document.querySelector(s);
function render(){
  const root=$("#qs"); root.innerHTML="";
  Q.forEach((q,i)=>{
    const sec=document.createElement("section"); sec.className="q"; sec.id="q-"+q.id;
    const head=document.createElement("div"); head.className="qhead";
    const left=document.createElement("div");
    left.innerHTML=`<div class="qnum">Q${i+1} / ${Q.length}${q.multi?"・複数選択":""}</div>`;
    const h=document.createElement("h2"); h.textContent=q.title; left.appendChild(h);
    const cats=document.createElement("div"); cats.className="cats";
    q.cats.forEach(c=>{const s=document.createElement("span");s.className="cat";s.textContent=c;cats.appendChild(s)});
    head.append(left,cats); sec.appendChild(head);
    const why=document.createElement("p"); why.className="why"; why.textContent=q.why; sec.appendChild(why);
    if(q.doc){const d=document.createElement("details");const sm=document.createElement("summary");sm.textContent="本文を開く";const pr=document.createElement("pre");pr.className="doc";pr.textContent=q.doc;d.append(sm,pr);sec.appendChild(d);}
    const opts=document.createElement("div"); opts.className="opts"; opts.setAttribute("role","group"); opts.setAttribute("aria-label",q.title);
    q.opts.forEach(([v,label,desc,rec,extra])=>{
      const b=document.createElement("button"); b.type="button"; b.className="opt"+(q.multi?" multi":""); b.dataset.q=q.id; b.dataset.v=v;
      const bl=document.createElement("b"); bl.textContent=label;
      if(rec){const r=document.createElement("span");r.className="rec";r.textContent="おすすめ";bl.appendChild(r)}
      const sm=document.createElement("small"); sm.textContent=desc;
      b.append(bl,sm);
      if(extra&&extra.swatch){const w=document.createElement("span");w.className="sw";extra.swatch.forEach(c=>{const i=document.createElement("i");i.style.background=c;i.title=c;w.appendChild(i)});b.appendChild(w)}
      if(extra&&extra.pre){const pr=document.createElement("span");pr.className="pre";pr.textContent=extra.pre;b.appendChild(pr)} b.addEventListener("click",()=>pick(q,v)); opts.appendChild(b);
    });
    sec.appendChild(opts);
    const ta=document.createElement("textarea"); ta.id="note-"+q.id; ta.placeholder="補足があれば（任意）"; ta.rows=1;
    ta.value=state.notes[q.id]||""; ta.addEventListener("input",()=>{state.notes[q.id]=ta.value;dirty()});
    sec.appendChild(ta); root.appendChild(sec);
  });
  const sec=document.createElement("section"); sec.className="q";
  sec.innerHTML=`<div class="qnum">自由記入（任意）</div><h2>ほかに伝えたいこと（公開に使う実名もここに）</h2><p class="why">例：アプリ名の候補、参考にしたいアカウント、避けたい色や表現 など。</p>`;
  const ta=document.createElement("textarea"); ta.id="free"; ta.rows=3; ta.value=state.free; ta.addEventListener("input",()=>{state.free=ta.value;dirty()});
  sec.appendChild(ta); root.appendChild(sec);
  paint();
}
function pick(q,v){
  if(q.multi){const cur=new Set(state.answers[q.id]||[]); cur.has(v)?cur.delete(v):cur.add(v); state.answers[q.id]=[...cur];}
  else state.answers[q.id]=v;
  paint(); dirty();
}
function answered(q){const a=state.answers[q.id];return q.multi?(a&&a.length>0):!!a}
function paint(){
  document.querySelectorAll(".opt").forEach(b=>{
    const a=state.answers[b.dataset.q]; const on=Array.isArray(a)?a.includes(b.dataset.v):a===b.dataset.v;
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  let n=0; Q.forEach(q=>{const ok=answered(q); if(ok)n++; const s=document.getElementById("q-"+q.id); if(s)s.classList.toggle("done",ok)});
  $("#fill").style.width=(n/Q.length*100)+"%"; $("#count").textContent=`${n} / ${Q.length} 回答済み`;
}
function dirty(){$("#status").textContent="未送信の変更があります";}
function labelOf(q,v){const o=q.opts.find(o=>o[0]===v);return o?o[1]:v}
function summary(){
  return Q.map((q,i)=>{const a=state.answers[q.id];const t=!a||(Array.isArray(a)&&!a.length)?"（未回答）":Array.isArray(a)?a.map(v=>labelOf(q,v)).join("、"):labelOf(q,a);
    const n=state.notes[q.id]?`／補足：${state.notes[q.id]}`:""; return `Q${i+1} ${q.title}\n→ ${t}${n}`}).join("\n\n")+(state.free?`\n\n自由記入：${state.free}`:"");
}
let db=null, ref=null;
render();
(async()=>{
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db){ $("#send").textContent="回答をコピー"; $("#status").textContent="保存機能が使えない表示です。「回答をコピー」でチャットに貼り付けてください。"; return; }
  ref = db.doc("answers/vet_check_dec");
  const t=setTimeout(()=>{$("#status").textContent="前回の回答を読み込めませんでした。新しく回答できます。"},10000);
  try{const s=await ref.get(); clearTimeout(t);
    if(s.exists){const d=s.data(); Object.assign(state.answers,d.answers||{}); Object.assign(state.notes,d.notes||{}); state.free=d.free||""; render();
      $("#status").textContent="前回送った回答を読み込みました。変更して送り直せます。";}
  }catch(e){clearTimeout(t);}
})();
$("#send").addEventListener("click",async()=>{
  const btn=$("#send");
  if(!ref){ try{await navigator.clipboard.writeText(summary()); $("#status").textContent="コピーしました。チャットに貼り付けてください。";}
    catch(e){$("#status").textContent="コピーできませんでした。お手数ですが選んだ内容をチャットでお知らせください。";} return; }
  btn.disabled=true; $("#status").textContent="送信中…";
  try{ await ref.set({answers:state.answers,notes:state.notes,free:state.free,summary:summary(),submittedAt:new Date().toISOString()});
    $("#status").textContent="ボンベイに届きました。チャットで「送ったよ」と伝えてください。";
  }catch(e){ $("#status").textContent="保存できませんでした（"+(e&&e.code||"エラー")+"）。もう一度押すか、チャットで答えを教えてください。"; }
  btn.disabled=false;
});
</script>
